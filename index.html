<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Periodic Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">
    <header>
        <h1>Periodic Table of Elements</h1>
        <div class="controls">
            <button id="btn-classic" class="active">Classic Table</button>
            <button id="btn-dense">Dense Grid</button>
            <button id="btn-list">List View</button>
            <button id="btn-3d">3D Sphere</button>
            <button id="btn-helix">3D Helix</button>
            <button id="btn-grid">3D Grid</button>
            <button id="btn-theme" title="Toggle Dark Mode">🌙</button>
        </div>
    </header>

    <main>
        <div id="container-2d">
            <div id="periodic-table" class="layout-classic">
                <!-- Elements will be dynamically generated by JS -->
            </div>
        </div>
        <div id="container-3d"></div>
    </main>

    <!-- Modal for Element Details -->
    <div id="element-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <div id="modal-details">
                <div class="modal-header">
                    <span id="modal-number"></span>
                    <h2 id="modal-symbol"></h2>
                </div>
                <h3 id="modal-name"></h3>
                <p id="modal-mass"></p>
                <p id="modal-category" class="category-label"></p>
                <div class="modal-body">
                    <p id="modal-description"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TrackballControls.js"></script>
    <script src="script.js"></script>
</body>
</html>
