<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Periodic Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">
    <header>
        <h1>Periodic Table of Elements</h1>
        <div class="controls">
            <div class="layout-buttons desktop-only">
                <button id="btn-classic" class="active">Classic Table</button>
                <button id="btn-dense">Dense Grid</button>
                <button id="btn-list">List View</button>
                <button id="btn-3d">3D Sphere</button>
                <button id="btn-helix">3D Helix</button>
                <button id="btn-grid">3D Grid</button>
            </div>
            <select id="layout-select" class="mobile-only">
                <option value="btn-classic">Classic Table</option>
                <option value="btn-dense">Dense Grid</option>
                <option value="btn-list">List View</option>
                <option value="btn-3d">3D Sphere</option>
                <option value="btn-helix">3D Helix</option>
                <option value="btn-grid">3D Grid</option>
            </select>
            <button id="btn-theme" title="Toggle Dark Mode">🌙</button>
            <button id="btn-instagram" title="Creator Instagram">
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram Icon" width="20" height="20">
            </button>
        </div>
    </header>

    <main>
        <div id="container-2d">
            <div id="periodic-table" class="layout-classic">
                <!-- Elements will be dynamically generated by JS -->
            </div>
        </div>
        <div id="container-3d"></div>
    </main>

    <!-- Modal for Element Details -->
    <div id="element-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <div id="modal-details">
                <div class="modal-header">
                    <span id="modal-number"></span>
                    <h2 id="modal-symbol"></h2>
                </div>
                <h3 id="modal-name"></h3>
                <p id="modal-mass"></p>
                <p id="modal-category" class="category-label"></p>
                <div class="modal-body">
                    <p id="modal-description"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Instagram Credit -->
    <div id="instagram-modal" class="modal">
        <div class="modal-content instagram-content">
            <span class="close-button" id="close-instagram">&times;</span>
            <div class="instagram-details">
                <div class="qr-code-container">
                    <!-- Replace this with your actual QR code image path -->
                    <img src="ig.jpg" alt="Instagram QR Code" id="instagram-qr">
                </div>
                <p class="ig-username">_tigeqx</p>
                <a href="https://www.instagram.com/_tigeqx" target="_blank" class="ig-link">ฟอลหน่อยจิ😶</a>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TrackballControls.js"></script>
    <script src="script.js"></script>
</body>
</html>
